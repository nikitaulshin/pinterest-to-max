schema: spec-driven

context: |
  Pinterest → MAX — небольшой сервис на TypeScript и Node.js 24.
  Playwright работает с веб-интерфейсами Pinterest и MAX без их API.
  SQLite и изображения хранятся локально. Запуск — Node.js или Docker Compose.
  HTTP API и веб-интерфейса нет. Интеграции пока не реализованы.

  Документация и OpenSpec-артефакты пишутся на русском языке.
  Идентификаторы, команды и общепринятые технические термины
  остаются на английском.

  Источники истины:
  - docs/agents/domain.md — сценарий, терминология и границы реализации;
  - openspec/specs/*/spec.md — действующие требования к поведению;
  - README.md, раздел «Архитектура» — структура и технические решения.

  CONTEXT.md сохранён из Медиасетки и не является источником требований.

  Перед планированием прочитай источники для области изменения.
  Сохраняй существующие агентские skills и приватные данные пользователя.

rules:
  proposal:
    - Описывай цель, границы и то, что не входит в изменение
    - Указывай влияние на локальные данные и обратную совместимость

  specs:
    - Описывай наблюдаемое поведение, значимые ошибки и граничные условия
    - Различай создание отложенного поста в MAX и его фактическую публикацию
    - "Нормативные требования формулируй с английскими ключевыми словами SHALL или MUST: строгий валидатор не распознаёт русские аналоги"

  design:
    - Ссылайся на действующую архитектуру вместо её дублирования
    - Фиксируй новые решения, компромиссы, зависимости и миграции данных

  tasks:
    - Для каждой задачи указывай адресные проверки затронутого поведения; правила выбора тестов заданы в AGENTS.md
    - Выноси npm run check в отдельную задачу финальной секции change
    - Для каждой новой фичи включай задачи обновления затронутой документации с конкретными файлами — README.md, docs/agents/domain.md и требований
    - Для архитектуры и доменной модели явно указывай в tasks.md либо задачи обновления, либо причину отсутствия изменений; документационные задачи входят в критерии завершения фичи
    - Структурируй задачи так, чтобы каждая могла выполняться отдельным агентом с чистым контекстом.
    - Каждая задача должна быть выполнима за один запуск агента и давать проверяемый рабочий результат, включая необходимые тесты.
    - Явно указывай зависимости между задачами.

operations:
  apply:
    guidance:
      - Не редактируй generated-код вручную
      - После отдельной задачи выполняй адресные проверки затронутого поведения и зависимых сценариев; правила выбора тестов заданы в AGENTS.md. Для обычной документации достаточно проверки содержания и форматирования
      - Выполняй npm run check один раз в финальной секции change
      - Используй успешные результаты финальных задач при завершении change. Повторяй проверку после новых изменений в её области; расширяй прогон, если исправление могло повлиять на другие области
      - Сохраняй вывод проверок в файлы вне репозитория и настоящий exit code. При фильтрации через tail или grep используй pipefail; для другого фрагмента вывода читай сохранённый файл
      - В отчёте указывай команды, exit code, пути к логам и ограничения проверки; выбранные тесты должны действительно выполниться, отсутствие совпадений не считается успехом
